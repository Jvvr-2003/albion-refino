# Compila o AlbionRefino.exe a cada push.
# Ao criar uma tag v* (ex.: v1.0.1), publica uma Release com o .exe anexado.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verificar código
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet .

      - name: Compilar para Windows
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          VERSION="$VERSION" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AlbionRefino
          path: |
            AlbionRefino.exe
            LEIA-ME.txt

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AlbionRefino.exe
            LEIA-ME.txt
          generate_release_notes: true
